<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral Project</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Inter,sans-serif;
  color:#e6e9ef;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  text-align:center;
  overflow:hidden;
  background:#05070f;
  perspective:1200px;
}

/* PARALLAX WRAPPER */
.parallax{
  position:fixed;
  inset:0;
  transform-style:preserve-3d;
  z-index:-1;
}

/* STAR LAYER */
.bg{
  position:absolute;
  inset:-10%;
  background:url("https://www.transparenttextures.com/patterns/stardust.png"),
             radial-gradient(circle,#0a0f24,#02040a);
  background-size:300px, cover;
  opacity:.45;
  transform:scale(1.2);
}

/* GLOW LAYER */
.glow{
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(circle at 30% 30%,rgba(77,163,255,.25),transparent),
    radial-gradient(circle at 70% 70%,rgba(77,163,255,.2),transparent);
  filter:blur(40px);
  transform:scale(1.3);
}

.container{
  max-width:900px;
  padding:50px;
  animation:fadeUp 1.2s ease;
}

/* LOGO */
.logo{
  width:360px;
  margin-bottom:30px;
  filter:
    drop-shadow(0 0 30px rgba(77,163,255,.7))
    drop-shadow(0 0 70px rgba(77,163,255,.4));
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-18px)}
  100%{transform:translateY(0)}
}

h1{
  font-size:48px;
  margin-bottom:25px;
  background:linear-gradient(90deg,#4da3ff,#8ec5ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

p{
  color:#c7d2e0;
  line-height:1.9;
  font-size:19px;
  margin-bottom:18px;
}

.highlight{
  color:#4da3ff;
  font-weight:600;
}

.back{
  display:inline-block;
  margin-top:30px;
  padding:14px 26px;
  border-radius:14px;
  text-decoration:none;
  color:white;
  background:linear-gradient(90deg,#4da3ff,#2563eb);
  font-weight:600;
}

.back:hover{
  box-shadow:0 0 25px rgba(77,163,255,.6);
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<!-- PARALLAX -->
<div class="parallax" id="parallax">
  <div class="bg"></div>
  <div class="glow"></div>
</div>

<div class="container">

<img class="logo" src="https://cdn.discordapp.com/attachments/1466932507772452874/1469032007186124892/image.png?ex=69862e2b&is=6984dcab&hm=69c0c9d3ba41210a8b525c0480602d31f87c9c7f72771c7eb4b19dfc36e9b3ec&">

<h1>Astral Project</h1>

<p><span class="highlight">Astral</span> to projekt stworzony przez <span class="highlight">kingsqy</span>, który odniósł sukces i nie okazał się klapą.</p>

<p>Projekt rozwijał się dzięki pomocy co-ownera <span class="highlight">iv0ra</span>, co pozwoliło Astralowi osiągnąć wysoki poziom jakości.</p>

<p>Astral łączy <span class="highlight">design premium</span>, nowoczesny styl i funkcjonalność.</p>

<a href="index.html" class="back">← Wróć</a>

</div>

<script>
const parallax = document.getElementById("parallax");

document.addEventListener("mousemove", e=>{
  let x = (e.clientX / window.innerWidth - 0.5) * 20;
  let y = (e.clientY / window.innerHeight - 0.5) * 20;

  parallax.style.transform =
    `rotateY(${x}deg) rotateX(${-y}deg)`;
});
</script>

</body>
</html>
